<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="img">
        <div class="header">

            <a href="index.html" style="color: blueviolet; font-family: Codec Pro;">Home</a>

            <div class="headerGap">
                <a href="cadastro.html" style="color: blueviolet; font-family: Codec Pro;">Cadastro</a>
                <a href="login.html" style="color: blueviolet; font-family: Codec Pro;">Login</a>
                <a href="informacoes.html" style="color: blueviolet; font-family: Codec Pro;">Informações</a>
            </div>
        </div>
    </div>


    <div class="cardPai">
        <div class="cardInner">
            <h1 style="font-family: Codec Pro;">login</h1> <br> <br>
            <span style="font-family: Codec Pro;"> Qual é o seu email: </span>
            <input type="text" class="ipt" id="ipt_email"> <br> <br>
            Qual é a sua senha:
            <input type="password" id="ipt_senha" class="ipt"> <br> <br>
            <button onclick="login()" class="buttonEntrar">Entrar</button>
        </div>
    </div>
</body>
<script>
    function login() {
        let email = ipt_email.value;
        let senha = ipt_senha.value;


        fetch("/loginR/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                emailServidor: email,
                senhaServidor: senha,
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                 if (resposta.ok) {
                  resposta.json().then(json =>{

                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.SENHA_USUARIO = json.senha;
                    sessionStorage.ID_USUARIO=json.idUsuario;
                  });
                 
                setTimeout(() => {
                    window.location = "quiz.html";
                }, "1000");

                
            } else {
                throw "Houve um erro ao tentar realizar o login!";
            }
      })
      .catch (function (resposta) {
        console.log(`#ERRO: ${resposta}`);
    });
    
    return false;
    }
</script>

</html>
