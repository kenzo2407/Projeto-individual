<body onload="obterDadosGrafico()">
    <div class="back_dashboard">

        <div class="background">
            <div class="painel">
                <div class="inner_painel">
                    <div class="p_painel" style="color: white;">
                        <img src="https://thumbs.dreamstime.com/b/%C3%ADcone-de-peixe-em-fundo-preto-ilustra%C3%A7%C3%A3o-vetorial-estilo-plano-168420947.jpg?w=768"
                            alt="" height="130px" width="130px">

                        <span>

                        </span>
                    </div>

            <div class="inner_dashboard">

                <div class="kpis">

                    <div class="kpi">
                        <h1 id="maiorPontuacao">0</h1>
                        <p>Maior Pontuação</p>
                    </div>

                    <div class="kpi">
                        <h1 id="mediaPontuacao">0</h1>
                        <p>Média de Pontuação</p>

                </div>

                <div class="cardPai">
                    <div class="row">

                        <div class="dashboardLinePai">
                            <div class="dashboardLine">
                                <canvas id="myChart"></canvas>

</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
   
    function obterDadosGrafico() {


        // esse fetch é usado para buscar os valores da pontuação no banco de dados através da rota dashboardR, dashboard controller, e dashboard model, usando o select do nome, da pontuação, do horário da resposta
        fetch(`/dashboardR/dashboard`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    plotarGrafico(resposta);
                    plotarGrafico2(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
            
            

             // esse fetch é usado para buscar os valores do banco de dados através da rota dashboardR, dashboard controller, dashboard model usando o select avg e max, para obter os valores da kpi
            fetch(`/dashboardR/kpi`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();
                    
                     plotarKpiMaior(resposta);
                     plotarKpiMedia(resposta);
                      
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
            
        }

            
            // Esta função *plotarGrafico* usa os dados capturados da função obtergraficodados para plottar na dashboard
            function plotarGrafico(resposta) {

        console.log('iniciando plotagem do gráfico...');

        // criando a lista labels, para dar nome aos dados e facilitar sua leitura
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Pontuação',
                data: [],
                borderColor: 'blue',
                tension: 0.1
            },
            ]
        };

        // a cada contagem feita, é incrementado na labels as pontuações e os momento_graficos do valor da posição da contagem, a contagem deve ser menor que o comprimento da resposta
        for (i = 0; i < resposta.length; i++) {
            var pontos = resposta[i];
            labels.push(pontos.momento_grafico);
            dados.datasets[0].data.push(pontos.pontuação);
        }

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log('Dados:')
        console.log('----------------------------------------------')

        const config = {
            type: 'line',
            data: dados,
        };

        let myChart = new Chart(
            document.getElementById('myChart'),
            config
        );
    }
    function plotarGrafico2(resposta) {

        let labels = [];

        let dados = {
            labels: labels,
            datasets: [{
                label: 'Nível de conhecimento',
                data: [],
                  backgroundColor: 'navy',
                tension: 0.1
            }]
        };
        // a cada contagem feita, é incrementado na labels os conhecimentos e os nomes do valor da posição da contagem, a contagem deve ser menor que o comprimento da resposta.
        for (i = 0; i < resposta.length; i++) {
            var pontos = resposta[i];
            labels.push(pontos.nome);
            dados.datasets[0].data.push(pontos.conhecimento);
        }

        const config = {
            type: 'bar',
            data: dados,
        };

        let myChart2 = new Chart(
            document.getElementById('myChart2'),
            config
        );
    }

   // funções que captam a resposta vinda do dashboard model, a partir dos selects feitos e plotados na kpi, com o id anteriormente mencionado, 'maiorPontuação' é o nome do espaço para mostrar a kpi
    function plotarKpiMaior(resposta) {
        document.getElementById('maiorPontuacao').innerHTML = resposta[0].maiorPontuacao;
    }
    
    function plotarKpiMedia(resposta){
        document.getElementById('mediaPontuacao').innerHTML = parseFloat(resposta[0].mediaPontuacao).toFixed(1);

    }


   

</script>

</html>
