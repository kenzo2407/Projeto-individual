<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  function obterDados(){
    
   fetch('/usuarios/dashboard',{
    method:"GET"
   })
   .then(function(response){
     return response.json();
   })

   .then(function(data){
     plotarGraficoLinha(data);
     plotarGraficoBarra(data);
   })

   .catch(function(err){
     console.log(err);
   })

    
  }
   

  function plotarGraficoLinha(data){
var usuario=[];
var pontos=[];

    for(var i = 0; i < data.length; i++){
      pontos.push(data[i].pontos);
      usuario.push(data[i].usuario);
    } 
  
  const ctx = document.getElementById('myChart');
  
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: usuario,
      datasets: [{
        label: 'Pontuação',
        data: pontos,
        borderWidth: 1
      }]
    },
  });
  }

  
function plotarGraficoBarra(data){
 var usuario=[];
var pontos=[];

    for(var i = 0; i < data.length; i++){
      pontos.push(data[i].pontos);
      usuario.push(data[i].usuario);
    } 
  
  const ctx2 = document.getElementById('myChart2');
  
  new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: usuario,
      datasets: [{
        label: 'Pontuação',
        data: pontos,
        borderWidth: 1
      }]
    },
  });
  }

  
</script>
