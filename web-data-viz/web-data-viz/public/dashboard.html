<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  function obterDados() {

    fetch('/usuarios/dashboard', {
       method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
    body: JSON.stringify({
        pontosServidor: pontos,
        qtd_usuariosServidor: qtd_usuarios,
      }),
    })
      .then(function (response) {
        return response.json();
      })

      .then(function (data) {
        plotarGraficoLinha(data);
        plotarGraficoBarra(data);
      })

      .catch(function (err) {
        console.log(err);
      })
  }


  function plotarGraficoLinha() {
    var usuario = [];
    var pontuacao = [];

    for (var i = 0; i < dados.length; i++) {
      pontuacao.push(dados[i].pontuacao);
      usuario.push(dados[i].usuario);
    }

    const ctx = document.getElementById('myChart');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: usuario,
        datasets: [{
          label: 'Pontuação',
          data: pontuacao,
          borderWidth: 1
        }]
      },
    });
  }


  function plotarGraficoBarra() {
    var usuario = [];
    var pontuacao = [];

    for (var i = 0; i < dados.length; i++) {
      pontuacao.push(dados[i].pontuacao);
      usuario.push(dados[i].usuario);
    }

    const data = {
      labels: usuario,
      datasets: [{
        label: 'Pontuação',
        data: pontuacao,
        backgroundColor: [
          'rgb(255, 99, 132)',
          'rgb(54, 162, 235)',
          'rgb(255, 205, 86)'
        ],
        hoverOffset: 4
      }]
    };

    const config2 = {
      type: 'bar',
      data: data,
    };


    const ctx2 = document.getElementById('myChart2');

    new Chart(ctx2, config2);

  }

</script>
