<script>

        let perguntas = [
            {
            pergunta: "Qual é a função do termostato?",
            opcoes:["Decorar Aquário", "Medir alimento", "Medir a temperatura", "Aquecer a água"],
            correta:2
            },

            {
            pergunta: "O pH da água influencia no que?",
            opcoes:["A saúde dos peixes", "O tamanho do aquário", "A cor do vidro", "A eficiência dos filtros"],
            correta:0
            },
            {
            pergunta: "Qual destes peixes é mais comum em aquários de água doce?",
            opcoes:["Tubarão", "Betta", "Baleia", "Jacaré"],
            correta:1
            },
            {
            pergunta: "O que pode acontecer em um aquário onde o ciclo de nitrogênio não esteja estabilizado?",
            opcoes:["A água aumenta de temperatura", "O nível de amônia pode aumentar e prejudicar os peixes", "Os peixes crescerão mais rápidos", "O filtro para de funcionar lentamente"],
            correta:1
            }
        ];

    let Atual=0;
    let pontuacao=0;

    function carregar(){
        div_pergunta.innerHTML=perguntas[Atual].pergunta;

        bt0.innerHTML= perguntas[Atual].opcoes[0];
        bt1.innerHTML= perguntas[Atual].opcoes[1];
        bt2.innerHTML= perguntas[Atual].opcoes[2];
        bt3.innerHTML= perguntas[Atual].opcoes[3];

    }

    function questao(escolha){
        if(escolha == perguntas[Atual].correta){
            pontuacao++;
        }
    
        Atual++;


        if(Atual < perguntas.length){
            carregar();
        }else {
            div_mensagem.innerHTML=`Fim do quiz! Você acertou ${pontuacao}`
        }
    }

carregar();
</script>
