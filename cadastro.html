    <div class="cardPai">
        <div class="card">
            <div class="innerCard"> <h1>cadastro</h1>  <br> <br>
                Email:
                <input type="text" class="InputCard" id="ipt_email" oninput="email()">
                <div id="div_email"></div> <br> 
                Nome do seu usuário(deve conter mais de 5 caracteres):
                <input class="InputCard" oninput="nome()" type="text" id="ipt_nome"> <br> 
                <div id="div_nome"></div>
                Senha:
                <input type="text" class="InputCard" id="ipt_senha" oninput="senha()">
                <div id="div_senha"></div> <br>
                
                Quanto você acha que você conhece sobre os aquários:
                <select name="conhecimento" id="conhecimento">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select> <br> <br>
                <button class="buttonCadastro" onclick="cadastrar()">Cadastre-se</button>
                <div id="div_button"></div>
            </div>
        </div>
    </div>
</body>
<script>
    function email(){
        let mensagem=``;
        let email= ipt_email.value;
        let temArroba= email.includes("@");
            if( temArroba == true){
                div_email.innerHTML=`Pode continuar`
            }else {
                div_email.innerHTML=`seu email deve conter o @`
            }
    }

    function nome(){
        let cont=0;
        let mensagem=``;
        let nome=ipt_nome.value;
        for (cont=0; cont <= nome.length; cont ++){
            if(nome.length >= 5){
            div_nome.innerHTML=`Pode continuar`
        }else {
            let diferenca= 5 - cont;
            div_nome.innerHTML=`Seu usuário deve contar mais ${diferenca} caracteres`
        }
        }
        /*
        if(nome.length >= 5){
            div_nome.innerHTML=`Pode continuar`
        }else {
            div_nome.innerHTML=`Seu usuário deve contar mais de 5 caracteres`
        }
            */
    }

    function senha(){
        let senha=ipt_senha.value;
        if(senha.length < 4){
            div_senha.innerHTML=`A senha não pode conter menos do que 4 caracteres`
        }else{
            div_senha.innerHTML=`Pode continuar`
        }
    }
    
   function cadastrar(){
    if (div_nome.innerHTML == 'Pode continuar' && div_email.innerHTML==`Pode continuar` && div_senha.innerHTML==`Pode continuar`){
        div_button.innerHTML=`Seu cadastro foi realizado com sucesso`
    }else{
        div_button.innerHTML=`Erro! Veja novamente se não há um erro nos campos do cadastro`
    }
   }
