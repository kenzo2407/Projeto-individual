<body>

    <div class="cardPai">
      <div class="row">

        <div class="dashboardLinePai">
          <div class="dashboardLine">
            <canvas id="myChart"></canvas>
          </div>
        </div>
        <div class="dashboardPiePai">
          <canvas id="myChart2"></canvas>
        </div>
      </div>
        <div class="dashboardBarPai">
          <canvas id="myChart3"></canvas>
        </div>
      </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById('myChart');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 3, 5, 2, 3],
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });



  const data = {
    labels: [
      'Red',
      'Blue',
      'Yellow'
    ],
    datasets: [{
      label: 'My First Dataset',
      data: [300, 50, 100],
      backgroundColor: [
        'rgb(255, 99, 132)',
        'rgb(54, 162, 235)',
        'rgb(255, 205, 86)'
      ],
      hoverOffset: 4
    }]
  };

  const config2 = {
    type: 'pie',
    data: data,
  };


  const ctx2 = document.getElementById('myChart2');

  new Chart(ctx2, config2);

  const data3 = {
    labels: [
      'Red',
      'Blue',
      'Yellow'
    ],
    datasets: [{
      label: 'My First Dataset',
      data: [300, 50, 100],
      backgroundColor: [
        'rgb(255, 99, 132)',
        'rgb(54, 162, 235)',
        'rgb(255, 205, 86)'
      ],
      hoverOffset: 4
    }]
  };

  const config3 = {
    type: 'bar',
    data: data,
  };

  const ctx3 = document.getElementById('myChart3');

  new Chart(ctx3, config3);

</script>
